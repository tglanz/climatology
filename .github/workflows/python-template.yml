name: Python CI Template

on:
  workflow_call:
    inputs:
      project_dir:
        description: Project directory to check
        required: true
        type: string
      submodule:
        description: Optional submodule required by the project
        default: ''
        type: string
      pylint_args:
        description: Additional pylint options
        default: ''
        type: string

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.check }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        check: [lint, tests]
    env:
      MPLBACKEND: Agg
      PROJECT_DIR: ${{ inputs.project_dir }}
      PROJECT_SUBMODULE: ${{ inputs.submodule }}
      PYLINT_ARGS: ${{ inputs.pylint_args }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize project submodule
        if: inputs.submodule != ''
        run: git submodule update --init --depth 1 -- "$PROJECT_SUBMODULE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ${{ inputs.project_dir }}/.python-version

      - name: Install uv
        run: python -m pip install uv==0.13.3

      - name: Install dependencies
        run: uv sync --locked --all-groups --project "$PROJECT_DIR"

      - name: Run pylint
        if: matrix.check == 'lint'
        run: uv run --no-sync --project "$PROJECT_DIR" pylint --rcfile="$PROJECT_DIR/pyproject.toml" ${PYLINT_ARGS} "$PROJECT_DIR/src"

      - name: Check formatting
        if: matrix.check == 'lint'
        run: uv run --no-sync --project "$PROJECT_DIR" black --check "$PROJECT_DIR"

      - name: Run tests
        if: matrix.check == 'tests'
        run: uv run --no-sync --project "$PROJECT_DIR" pytest "$PROJECT_DIR/tests"
