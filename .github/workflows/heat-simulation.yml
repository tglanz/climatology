name: heat-simulation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'heat-simulation/**'
      - '.github/workflows/heat-simulation.yml'
      - '.github/workflows/python-template.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heat-simulation:
    uses: ./.github/workflows/python-template.yml
    with:
      project_dir: heat-simulation
