# TODO: theres some inconsistency / inaccurate terminology wrt "data".
# first of all, is "data" what lives in the experiment/data dir?
# if so, simulations are not "data".
# second of all, the experiment_dir should not be under "data".
# need to think - but i think we could have "[data] + [simulation]" sections and also extract the "experiment_dir" into [path].
# not sure if we need a "[experiment]". however, now that i think of it, maybe the best thing to do is to replace [path] with [experiment].
[data]
experiment_dir = "./output/barotropic_stirring-T85"
simulation_pattern = "simulations/*"
segment_pattern = "run*/atmos_daily.nc"
x_vars = ["vor", "stirring"]
y_vars = ["vor"]

# Windowing surface. See docs/pre-processing.md for semantics.
# [data.spinup] and [data.convergence] are optional; omit either
# section to disable that detector. [data.windows] is always required.

[data.windows]
# "beginning" | "spinup". "spinup" requires [data.spinup].
start_at = "spinup"
# "end" | "convergence". "convergence" requires [data.convergence].
end_at = "end"
# K consecutive snapshots per input.
length = 5
# gap between consecutive window starts. 6 = K + 1 (tumbling-equivalent).
stride = 6
# optional cap on windows per simulation; omit for no cap.
limit = 2

[data.spinup]
z_threshold = 0.05
stable_time = 3
window_size = 10


[data.split]
validation = 0.1
test = 0.1
train = 0.8
# Just for debug, i want preprocessing to be quick
# train_limit=5
# test_limit=1
# validation_limit=1

# Architecture selector. Valid: "fno" | "sfno".
# Per-architecture options live in [model.<arch>]; only the active
# sub-section is consumed at load time, but the inactive one is parsed
# if present so toggling architecture is a one-line change here.
[model]
architecture = "sfno"

[model.fno]
n_modes = [32, 64]
hidden_channels = 64
n_layers = 4
# in_channels MUST equal data.windows.length * len(data.x_vars). Validated at config load.
in_channels = 10
out_channels = 1

[model.sfno]
n_modes = [32, 64]
hidden_channels = 64
n_layers = 4
in_channels = 10
out_channels = 1

[training]
epochs = 300
batch_size = 64
learning_rate = 1e-3
# mse | relative_l2 | lat_weighted_relative_l2
loss = "lat_weighted_relative_l2"
# adam | adamw
optimizer = "adamw"
# gradient norm clipping
# grad_clip = 1.0

# Regularization. No defaults; absent fields are not applied.
[training.regularization]
weight_decay = 1e-3   # only used when optimizer = "adamw"
dropout      = 0.1    # forwarded to FNO as channel_mlp_dropout

# Early stopping. Each subsection that is present is enabled. Any criterion
# firing stops training. Remove a subsection to disable it.

[training.early_stopping.target_loss]
value = 0.1
# val | train
monitor = "train" 

[training.early_stopping.patience]
patience = 20
min_delta = 1e-4
# val | train
monitor = "train"

# TODO: this can just be training.scheduler
[training.scheduler]
# step | cosine | plateau | none
kind = "cosine"

[training.scheduler.step]
step_size = 100
gamma = 0.5

[training.scheduler.cosine]
# t_max defaults to training.epochs when omitted
eta_min = 0.0

[training.scheduler.plateau]
patience = 15
factor = 0.5
threshold = 1e-4
eta_min = 0.0

[logging]
level = "debug"
stdout = true

# [paths]
# checkpoint_dir = ...     # defaults to <experiment_dir>/training
# preprocessed_dir = ...   # defaults to <experiment_dir>/data
# training_info_file = ... # defaults to <experiment_dir>/training/training.json
