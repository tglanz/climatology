[data]
experiment_dir = "./output/barotropic_stirring-T85"
simulation_pattern = "simulations/*"
segment_pattern = "run*/atmos_daily.nc"
x_vars = ["vor", "stirring"]
y_vars = ["vor"]
split = [0.5, 0.25, 0.25]
skip = 50
samples_per_experiment = 10
sampling = "uniform"

[model.fno]
n_modes = [64, 64]
hidden_channels = 64
in_channels = 2
out_channels = 1

[training]
epochs = 300
target_loss = 0.1
batch_size = 16
learning_rate = 1e-3
lr_decay_factor = 0.5
lr_decay_every = 100
loss = "relative_l2"
optimizer = "adam"
weight_decay = 0.0

[logging]
level = "INFO"
stdout = true

# [paths]
# checkpoint_dir = ...   # defaults to <experiment_dir>/checkpoints
# preprocessed_dir = ... # defaults to <experiment_dir>/training-data
