[project]
name = "ml"
version = "0.1.0"
description = "Global Physical Climatology: ML training, inference, and analysis"
readme = "README.md"
authors = [
    { name = "Tal Glanzman", email = "talglanzman@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "numpy",
    "xarray",
    "netCDF4",
    "click",
    "tqdm>=4.67.3",
]

[project.scripts]
ml = "ml.cmd.cli:cli"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
neuraloperator = { path = "../submodules/neuraloperator", editable = true }

[dependency-groups]
train = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "neuraloperator",
    "h5py",
    "rich>=13",
    "plotext>=5",
]
inference = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
    "neuraloperator",
]
vis = [
    "cartopy>=0.25",
    "matplotlib",
    "dask",
    "pandas",
    "jupyter",
    "nbconvert>=7",
    "ipykernel",
    "ipython",
]
dev = [
    "black",
    "pylint",
    "pytest",
]

[tool.pylint.messages_control]
disable = [
    "missing-function-docstring",
    "missing-class-docstring",
    "missing-module-docstring",
    "too-many-locals",
]
